name: mindflow-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindflow}
      POSTGRES_DB: ${POSTGRES_DB:-mindflow}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mindflow} -d ${POSTGRES_DB:-mindflow}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindflow

  redis:
    image: redis:7-alpine
    container_name: mindflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindflow

  adminer:
    image: adminer:4
    container_name: mindflow-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    networks:
      - mindflow

volumes:
  postgres-data:
  redis-data:

networks:
  mindflow:
    driver: bridge
