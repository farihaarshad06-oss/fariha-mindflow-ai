version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mindflow_ai
      POSTGRES_USER: fariha
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fariha"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      DEFAULT_SERVER_MODE: "WEB"
    
  volumes:
    postgres-data:
    redis-data:

volumes:
  postgres-data:
  redis-data: